name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        working-directory: 06-best-practices/code/review
        run: pytest -q
      
      - name: Build Docker image
        working-directory: 06-best-practices/code/review
        run: docker build -t review-app:ci .