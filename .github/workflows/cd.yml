name: CD

on:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Run tests
        working-directory: 06-best-practices/code/review
        run: |
          pip install pytest
          pytest -q

      - name: Build Docker image
        working-directory: 06-best-practices/code/review
        run: docker build -t review-app:latest .

      # 🚨 你需要在这里加上推送到云镜像仓库的逻辑！
      # 比如 docker tag + docker push