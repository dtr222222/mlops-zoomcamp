name: CD

on:
  push:
    branches: [main]

jobs:
  # 第一步：测试
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install pytest and flask
        run: pip install pytest flask

      - name: Run tests
        working-directory: 06-best-practices/code/review
        run: pytest -q

  # 第二步：构建并推送到 Docker Hub
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        working-directory: 06-best-practices/code/review
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/review-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/review-app:latest

  # 第三步：部署到你的阿里云服务器
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Aliyun
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "开始拉取最新镜像..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/review-app:latest
            echo "停止并删除旧容器..."
            docker stop review-app || true
            docker rm review-app || true
            echo "启动新容器..."
            docker run -d -p 8000:8000 --name review-app ${{ secrets.DOCKER_USERNAME }}/review-app:latest